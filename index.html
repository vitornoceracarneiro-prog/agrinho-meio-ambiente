<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Contador Interativo</h1>
        <p>Clique nos botões para ver a mágica do JavaScript acontecer!</p>

            <span id="valor-contador">0</span>
        </div>

        <div class="botoes-container">
            <button id="btn-diminuir" class="btn">Diminuir</button>
            <button id="btn-resetar" class="btn">Resetar</button>
            <button id="btn-aumentar" class="btn">Aumentar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
